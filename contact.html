<!doctype html>
<html lang="en" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – Felix Winkler</title>
<meta name="description" content="Get in touch with Felix Winkler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css?v=14">
</head>
<body data-title="title.contact">
<header class="site-header">
  <div class="bar">
    <a class="brand" href="index.html">Felix Winkler<small data-i18n="brand.sub">A Project Showcase</small></a>
    <div class="right">
      <nav class="topnav" aria-label="Main">
        <ul>
          <li><a href="projects.html" data-i18n="nav.projects">Projects</a></li>
          <li><a href="side-projects.html" data-i18n="nav.side">Side Projects</a></li>
          <li><a href="cv.html" data-i18n="nav.cv">CV</a></li>
          <li><a href="contact.html" aria-current="page" data-i18n="nav.contact">Contact</a></li>
        </ul>
      </nav>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button><button type="button" data-lang="de">DE</button>
      </div>
    </div>
  </div>
</header>
<main>
  <div class="sheet">
    <p class="label" data-i18n="co.label">Get in touch</p>
    <h1 data-i18n="co.h1">Contact</h1>
    <p class="tagline" data-i18n="co.tagline">Feel free to reach out via one of the channels below.</p>

    <h2 data-i18n="co.h.online">Find me online</h2>
    <div class="links" id="social-links"></div>

    <div id="form-section">
      <h2 data-i18n="co.h.msg">Send a message</h2>
      <form class="contact" id="contact-form" method="post">
        <label><span data-i18n="co.f.name">Name</span><input type="text" name="name" required></label>
        <label><span data-i18n="co.f.mail">Your e-mail (for my reply)</span><input type="email" name="email" required></label>
        <label><span data-i18n="co.f.msg">Message</span><textarea name="message" rows="6" required></textarea></label>
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit" data-i18n="co.f.send">Send</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </div>
</main>
<script src="assets/i18n.js?v=14"></script>
<script src="assets/site.js?v=14"></script>
</body>
</html>
