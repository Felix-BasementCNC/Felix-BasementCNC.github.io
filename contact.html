</head>
<body>
<header class="site-header">
  <div class="bar">
    <a class="brand" href="index.html">Felix Winkler<small>A Project Showcase</small></a>
    <nav class="topnav" aria-label="Main">
      <ul>
        <li><a href="projects.html">Projects</a></li>

        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>
<main>
  <div class="sheet">
    <p class="label">Get in touch</p>
    <h1>Contact</h1>
    <p class="tagline">Feel free to reach out via one of the channels below.</p>

    <h2>Find me online</h2>
    <div class="links" id="social-links"></div>

    <div id="form-section">
      <h2>Send a message</h2>
      <form class="contact" id="contact-form" method="post">
        <label>Name<input type="text" name="name" required></label>
        <label>Your e-mail (for my reply)<input type="email" name="email" required></label>
        <label>Message<textarea name="message" rows="6" required></textarea></label>
        <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit">Send</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </div>
</main>
<script src="assets/site.js?v=4"></script>
</body>
</html>
